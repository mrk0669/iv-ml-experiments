<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A6"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- Lane backgrounds -->
  <rect x="20" y="60" width="1160" height="150" rx="12" fill="#EEF2F8"/>
  <text x="40" y="90" font-size="15" font-weight="bold" fill="#1B7F5B">BUYER JOURNEY</text>

  <rect x="20" y="380" width="1160" height="150" rx="12" fill="#FDF1E7"/>
  <text x="40" y="410" font-size="15" font-weight="bold" fill="#E06A1F">SUPPLIER JOURNEY</text>

  <!-- Buyer steps -->
  <g font-size="12.5" fill="#0B2447">
    <rect x="40" y="110" width="150" height="70" rx="8" fill="#1B7F5B"/>
    <text x="115" y="140" text-anchor="middle" fill="#fff" font-weight="bold">1. Discover</text>
    <text x="115" y="158" text-anchor="middle" fill="#fff" font-size="11">Search / landing / referral</text>

    <rect x="230" y="110" width="150" height="70" rx="8" fill="#1B7F5B"/>
    <text x="305" y="140" text-anchor="middle" fill="#fff" font-weight="bold">2. Browse &amp; Filter</text>
    <text x="305" y="158" text-anchor="middle" fill="#fff" font-size="11">Category, location, certs</text>

    <rect x="420" y="110" width="150" height="70" rx="8" fill="#1B7F5B"/>
    <text x="495" y="140" text-anchor="middle" fill="#fff" font-weight="bold">3. View Listing</text>
    <text x="495" y="158" text-anchor="middle" fill="#fff" font-size="11">Specs + impact data</text>

    <rect x="610" y="110" width="150" height="70" rx="8" fill="#1B7F5B"/>
    <text x="685" y="132" text-anchor="middle" fill="#fff" font-weight="bold">4. Send RFQ /</text>
    <text x="685" y="148" text-anchor="middle" fill="#fff" font-weight="bold">Message Seller</text>

    <rect x="800" y="110" width="150" height="70" rx="8" fill="#1B7F5B"/>
    <text x="875" y="140" text-anchor="middle" fill="#fff" font-weight="bold">5. Negotiate</text>
    <text x="875" y="158" text-anchor="middle" fill="#fff" font-size="11">Price, qty, pickup terms</text>

    <rect x="990" y="110" width="150" height="70" rx="8" fill="#1B7F5B"/>
    <text x="1065" y="140" text-anchor="middle" fill="#fff" font-weight="bold">6. Confirm &amp; Pay</text>
    <text x="1065" y="158" text-anchor="middle" fill="#fff" font-size="11">Funds held in escrow</text>
  </g>
  <!-- Buyer arrows -->
  <g stroke="#8A93A6" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="190" y1="145" x2="228" y2="145"/>
    <line x1="380" y1="145" x2="418" y2="145"/>
    <line x1="570" y1="145" x2="608" y2="145"/>
    <line x1="760" y1="145" x2="798" y2="145"/>
    <line x1="950" y1="145" x2="988" y2="145"/>
  </g>

  <!-- Supplier steps -->
  <g font-size="12.5" fill="#0B2447">
    <rect x="40" y="430" width="150" height="70" rx="8" fill="#E06A1F"/>
    <text x="115" y="452" text-anchor="middle" fill="#fff" font-weight="bold">1. Sign Up &amp;</text>
    <text x="115" y="468" text-anchor="middle" fill="#fff" font-weight="bold">Verify Business</text>

    <rect x="230" y="430" width="150" height="70" rx="8" fill="#E06A1F"/>
    <text x="305" y="452" text-anchor="middle" fill="#fff" font-weight="bold">2. Create Listing</text>
    <text x="305" y="468" text-anchor="middle" fill="#fff" font-size="11">Tag sustainability data</text>

    <rect x="420" y="430" width="150" height="70" rx="8" fill="#E06A1F"/>
    <text x="495" y="460" text-anchor="middle" fill="#fff" font-weight="bold">3. Receive Inquiries</text>

    <rect x="610" y="430" width="150" height="70" rx="8" fill="#E06A1F"/>
    <text x="685" y="460" text-anchor="middle" fill="#fff" font-weight="bold">4. Negotiate</text>

    <rect x="800" y="430" width="150" height="70" rx="8" fill="#E06A1F"/>
    <text x="875" y="460" text-anchor="middle" fill="#fff" font-weight="bold">5. Accept Order</text>

    <rect x="990" y="430" width="150" height="70" rx="8" fill="#E06A1F"/>
    <text x="1065" y="452" text-anchor="middle" fill="#fff" font-weight="bold">6. Coordinate</text>
    <text x="1065" y="468" text-anchor="middle" fill="#fff" font-weight="bold">Logistics</text>
  </g>
  <g stroke="#E8874A" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="190" y1="465" x2="228" y2="465"/>
    <line x1="380" y1="465" x2="418" y2="465"/>
    <line x1="570" y1="465" x2="608" y2="465"/>
    <line x1="760" y1="465" x2="798" y2="465"/>
    <line x1="950" y1="465" x2="988" y2="465"/>
  </g>

  <!-- Converge arrows into transaction box -->
  <line x1="1065" y1="180" x2="600" y2="250" stroke="#8A93A6" stroke-width="2"/>
  <line x1="1065" y1="430" x2="600" y2="290" stroke="#E8874A" stroke-width="2"/>

  <!-- Shared transaction box -->
  <rect x="420" y="250" width="360" height="80" rx="10" fill="#0B2447"/>
  <text x="600" y="282" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Shared: Transaction &amp; Fulfillment</text>
  <text x="600" y="302" text-anchor="middle" fill="#DCE3F5" font-size="12">Escrow release &#8594; logistics pickup/delivery &#8594; receipt confirmation</text>

  <line x1="600" y1="330" x2="600" y2="360" stroke="#0B2447" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="600" y1="500" x2="600" y2="360" stroke="#0B2447" stroke-width="2"/>

  <!-- Post transaction row -->
  <rect x="20" y="600" width="1160" height="130" rx="12" fill="#F1EEFA"/>
  <text x="40" y="628" font-size="15" font-weight="bold" fill="#5E4198">POST-TRANSACTION (BOTH PARTIES)</text>

  <rect x="150" y="650" width="220" height="60" rx="8" fill="#5E4198"/>
  <text x="260" y="686" text-anchor="middle" fill="#fff" font-weight="bold">Rate &amp; Review Counterparty</text>

  <rect x="490" y="650" width="220" height="60" rx="8" fill="#5E4198"/>
  <text x="600" y="675" text-anchor="middle" fill="#fff" font-weight="bold">Sustainability Impact</text>
  <text x="600" y="693" text-anchor="middle" fill="#fff" font-weight="bold">Report Generated</text>

  <rect x="830" y="650" width="220" height="60" rx="8" fill="#5E4198"/>
  <text x="940" y="675" text-anchor="middle" fill="#fff" font-weight="bold">Reputation / Badge</text>
  <text x="940" y="693" text-anchor="middle" fill="#fff" font-weight="bold">Score Updated</text>

  <line x1="600" y1="500" x2="600" y2="600" stroke="#0B2447" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="600" y1="600" x2="260" y2="648" stroke="#5E4198" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="600" y1="600" x2="600" y2="648" stroke="#5E4198" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="600" y1="600" x2="940" y2="648" stroke="#5E4198" stroke-width="1.5" marker-end="url(#arrow2)"/>
</svg>
