<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#FFFFFF"/>

  <!-- helper style: entity box with header -->
  <!-- Organization -->
  <g>
    <rect x="30" y="40" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#0B2447" stroke-width="1.5"/>
    <rect x="30" y="40" width="230" height="30" rx="8" fill="#0B2447"/>
    <rect x="30" y="55" width="230" height="15" fill="#0B2447"/>
    <text x="145" y="61" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Organization</text>
    <g font-size="11" fill="#22222A">
      <text x="42" y="86">id (PK)</text>
      <text x="42" y="103">name, type [supplier|buyer|both]</text>
      <text x="42" y="120">verification_status</text>
      <text x="42" y="137">address, geo_location</text>
      <text x="42" y="154">sustainability_rating</text>
      <text x="42" y="171">created_at</text>
    </g>
  </g>

  <!-- User -->
  <g>
    <rect x="30" y="230" width="230" height="120" rx="8" fill="#FFFFFF" stroke="#0B2447" stroke-width="1.5"/>
    <rect x="30" y="230" width="230" height="30" rx="8" fill="#0B2447"/>
    <rect x="30" y="245" width="230" height="15" fill="#0B2447"/>
    <text x="145" y="251" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">User</text>
    <g font-size="11" fill="#22222A">
      <text x="42" y="276">id (PK)</text>
      <text x="42" y="293">org_id (FK &#8594; Organization)</text>
      <text x="42" y="310">name, email, role</text>
      <text x="42" y="327">auth_provider</text>
    </g>
  </g>

  <!-- Certification -->
  <g>
    <rect x="30" y="390" width="230" height="120" rx="8" fill="#FFFFFF" stroke="#E06A1F" stroke-width="1.5"/>
    <rect x="30" y="390" width="230" height="30" rx="8" fill="#E06A1F"/>
    <rect x="30" y="405" width="230" height="15" fill="#E06A1F"/>
    <text x="145" y="411" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Certification</text>
    <g font-size="11" fill="#22222A">
      <text x="42" y="436">id (PK)</text>
      <text x="42" y="453">org_id (FK &#8594; Organization)</text>
      <text x="42" y="470">cert_type, issuer</text>
      <text x="42" y="487">valid_until, document_url</text>
    </g>
  </g>

  <!-- Category -->
  <g>
    <rect x="330" y="40" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#1B7F5B" stroke-width="1.5"/>
    <rect x="330" y="40" width="210" height="30" rx="8" fill="#1B7F5B"/>
    <rect x="330" y="55" width="210" height="15" fill="#1B7F5B"/>
    <text x="435" y="61" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Category</text>
    <g font-size="11" fill="#22222A">
      <text x="342" y="86">id (PK)</text>
      <text x="342" y="103">name, parent_id (self-FK)</text>
      <text x="342" y="120">taxonomy_path</text>
    </g>
  </g>

  <!-- Listing (central entity) -->
  <g>
    <rect x="330" y="230" width="250" height="180" rx="8" fill="#FFFFFF" stroke="#1B7F5B" stroke-width="2"/>
    <rect x="330" y="230" width="250" height="30" rx="8" fill="#1B7F5B"/>
    <rect x="330" y="245" width="250" height="15" fill="#1B7F5B"/>
    <text x="455" y="251" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Listing</text>
    <g font-size="11" fill="#22222A">
      <text x="342" y="276">id (PK)</text>
      <text x="342" y="293">org_id (FK &#8594; Organization)</text>
      <text x="342" y="310">category_id (FK &#8594; Category)</text>
      <text x="342" y="327">title, description, condition</text>
      <text x="342" y="344">quantity, unit, exchange_type</text>
      <text x="342" y="361">[sell | donate | swap], price</text>
      <text x="342" y="378">status, image_refs (S3), tags</text>
      <text x="342" y="395">created_at, expires_at</text>
    </g>
  </g>

  <!-- SustainabilityMetric -->
  <g>
    <rect x="330" y="450" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1B7F5B" stroke-width="1.5"/>
    <rect x="330" y="450" width="250" height="30" rx="8" fill="#1B7F5B"/>
    <rect x="330" y="465" width="250" height="15" fill="#1B7F5B"/>
    <text x="455" y="471" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">SustainabilityMetric</text>
    <g font-size="11" fill="#22222A">
      <text x="342" y="496">id (PK)</text>
      <text x="342" y="513">listing_id (FK &#8594; Listing)</text>
      <text x="342" y="530">co2e_saved_kg, waste_diverted_kg</text>
      <text x="342" y="547">calculation_methodology_ref</text>
    </g>
  </g>

  <!-- Transaction (central) -->
  <g>
    <rect x="660" y="230" width="250" height="180" rx="8" fill="#FFFFFF" stroke="#0B2447" stroke-width="2"/>
    <rect x="660" y="230" width="250" height="30" rx="8" fill="#0B2447"/>
    <rect x="660" y="245" width="250" height="15" fill="#0B2447"/>
    <text x="785" y="251" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Transaction</text>
    <g font-size="11" fill="#22222A">
      <text x="672" y="276">id (PK)</text>
      <text x="672" y="293">listing_id (FK &#8594; Listing)</text>
      <text x="672" y="310">buyer_org_id (FK &#8594; Organization)</text>
      <text x="672" y="327">seller_org_id (FK &#8594; Organization)</text>
      <text x="672" y="344">status [rfq|negotiating|</text>
      <text x="672" y="361">  paid|fulfilled|closed]</text>
      <text x="672" y="378">agreed_price, escrow_status</text>
      <text x="672" y="395">created_at, closed_at</text>
    </g>
  </g>

  <!-- Message -->
  <g>
    <rect x="990" y="40" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#4658C9" stroke-width="1.5"/>
    <rect x="990" y="40" width="200" height="30" rx="8" fill="#4658C9"/>
    <rect x="990" y="55" width="200" height="15" fill="#4658C9"/>
    <text x="1090" y="61" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Message</text>
    <g font-size="11" fill="#22222A">
      <text x="1002" y="86">id (PK)</text>
      <text x="1002" y="103">transaction_id (FK)</text>
      <text x="1002" y="120">sender_id (FK &#8594; User), body</text>
    </g>
  </g>

  <!-- Payment -->
  <g>
    <rect x="990" y="170" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#4658C9" stroke-width="1.5"/>
    <rect x="990" y="170" width="200" height="30" rx="8" fill="#4658C9"/>
    <rect x="990" y="185" width="200" height="15" fill="#4658C9"/>
    <text x="1090" y="191" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Payment</text>
    <g font-size="11" fill="#22222A">
      <text x="1002" y="216">id (PK)</text>
      <text x="1002" y="233">transaction_id (FK)</text>
      <text x="1002" y="250">amount, provider_ref, status</text>
    </g>
  </g>

  <!-- Shipment -->
  <g>
    <rect x="990" y="300" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#4658C9" stroke-width="1.5"/>
    <rect x="990" y="300" width="200" height="30" rx="8" fill="#4658C9"/>
    <rect x="990" y="315" width="200" height="15" fill="#4658C9"/>
    <text x="1090" y="321" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Shipment</text>
    <g font-size="11" fill="#22222A">
      <text x="1002" y="346">id (PK)</text>
      <text x="1002" y="363">transaction_id (FK)</text>
      <text x="1002" y="380">carrier, tracking_number</text>
      <text x="1002" y="397">pickup_addr, delivery_addr</text>
    </g>
  </g>

  <!-- Review -->
  <g>
    <rect x="990" y="440" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#4658C9" stroke-width="1.5"/>
    <rect x="990" y="440" width="200" height="30" rx="8" fill="#4658C9"/>
    <rect x="990" y="455" width="200" height="15" fill="#4658C9"/>
    <text x="1090" y="461" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Review</text>
    <g font-size="11" fill="#22222A">
      <text x="1002" y="486">id (PK)</text>
      <text x="1002" y="503">transaction_id (FK)</text>
      <text x="1002" y="520">reviewer_id (FK), rating</text>
      <text x="1002" y="537">comment</text>
    </g>
  </g>

  <!-- Relationship lines with cardinality -->
  <g stroke="#8A93A6" stroke-width="1.5" fill="none">
    <path d="M260,115 L330,90"/>
    <path d="M145,190 L145,230"/>
    <path d="M145,350 L145,390"/>
    <path d="M330,90 L260,115" opacity="0"/>
    <path d="M260,150 L330,320"/>
    <path d="M540,90 L580,240" />
    <path d="M455,410 L455,450"/>
    <path d="M580,320 L660,320"/>
    <path d="M910,290 L990,90"/>
    <path d="M910,300 L990,220"/>
    <path d="M910,320 L990,355"/>
    <path d="M910,350 L990,495"/>
  </g>
  <g font-size="10.5" fill="#5B6472">
    <text x="150" y="212">1&#8594;N</text>
    <text x="150" y="372">1&#8594;N</text>
    <text x="270" y="230">1&#8594;N</text>
    <text x="500" y="150">N&#8594;1</text>
    <text x="465" y="435">1&#8594;1</text>
    <text x="600" y="315">1&#8594;N</text>
    <text x="935" y="180">1&#8594;N</text>
    <text x="935" y="255">1&#8594;1</text>
    <text x="935" y="330">1&#8594;1</text>
    <text x="935" y="430">1&#8594;N</text>
  </g>

  <!-- Legend / note -->
  <rect x="30" y="600" width="1160" height="130" rx="10" fill="#F3F4F8" stroke="#D7DCE8"/>
  <text x="50" y="628" font-size="13" font-weight="bold" fill="#0B2447">Design notes</text>
  <text x="50" y="650" font-size="11.5" fill="#22222A">- PostgreSQL is the system of record; each bounded-context service owns its own tables and exposes data via its API (no cross-service joins).</text>
  <text x="50" y="670" font-size="11.5" fill="#22222A">- Flexible/variable listing attributes (material spec sheets, certifications) are stored as JSONB columns rather than rigid schemas, since resource types vary widely.</text>
  <text x="50" y="690" font-size="11.5" fill="#22222A">- SustainabilityMetric is computed at listing-creation time and re-validated at transaction close, feeding the aggregate Impact Report shown to both parties.</text>
  <text x="50" y="710" font-size="11.5" fill="#22222A">- Listing and Transaction records are denormalized into OpenSearch and the analytics warehouse via change-data-capture for fast search and reporting.</text>
</svg>
